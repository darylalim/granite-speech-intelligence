[project]
name = "granite-speech-intelligence"
version = "0.19.0"
description = "Offline English speech-to-text on Apple Silicon: IBM Granite Speech 5.0 TurboCTC on MLX, with Silero VAD timestamps, plus on-device summaries and yes/no questions from Granite 4.2, in a Streamlit app."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Daryl Lim" }]
dependencies = [
    # 19.0 decodes container/stream tag text with "surrogateescape", which
    # cannot raise; 18.x decoded strictly, so an ANSI RIFF INFO tag failed the
    # open, and 19 removed the metadata_errors= switch that worked around it.
    "av>=19.0.0",
    "mlx-audio>=0.5.1",
    # Transcript analysis (Granite 4.2 3B). The floor is the release its API
    # (load, generate_step, prompt caches) was checked against.
    "mlx-lm>=0.32.2",
    # The waveform type (it replaced torch.Tensor). mlx and mlx-audio pull it
    # in anyway; declared because the app builds its arrays directly.
    "numpy",
    # st.space (the stretch spacer that floats the toggle and the download
    # button right) landed in 1.51.0; everything else the layout uses —
    # horizontal containers, container/button width= — is 1.48.0.
    "streamlit>=1.51.0",
]

[dependency-groups]
dev = [
    "pytest",
    # tests/test_app_ui.py iterates AppTest.session_state, which only became
    # iterable in 1.64.0 (streamlit#16897).
    "streamlit>=1.64.0",
    "ty",
    "ruff",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ty.environment]
python-version = "3.12"
