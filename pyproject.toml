[project]
name = "granite-speech-intelligence"
version = "0.15.0"
description = "Streamlit application for English speech transcription using IBM Granite Speech 5.0 TurboCTC on Apple Silicon with MLX."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Daryl Lim" }]
dependencies = [
    "av>=18.1.0",
    "mlx-audio>=0.5.1",
    # Pinned: this checkpoint is the other half of the bit-exact pair that
    # MLX_VAD_REVISION freezes, and 6.1/5.x ship different weights. 6.2.2 (a)
    # declares `torchaudio<2.10` — its only torchaudio users are its own
    # read_audio/save_audio, which this app never calls, and inheriting the
    # bound drags torchaudio to 2.9.1 and torch with it (2.14 -> 2.9.1) — and
    # (b) imports onnxruntime at package import while declaring it only as an
    # extra, so `import silero_vad` fails here. Its .jit checkpoint is
    # byte-identical to 6.2.1's. Move the pin once a release drops the bound
    # AND stops importing onnxruntime eagerly.
    "silero-vad==6.2.1",
    # st.space (the stretch spacer that floats the toggle and the download
    # button right) landed in 1.51.0; everything else the layout uses —
    # horizontal containers, container/button width= — is 1.48.0.
    "streamlit>=1.51.0",
    "torch",
    "torchaudio",
]

[dependency-groups]
dev = [
    "pytest",
    # tests/test_app_ui.py iterates AppTest.session_state, which only became
    # iterable in 1.64.0 (streamlit#16897).
    "streamlit>=1.64.0",
    "ty",
    "ruff",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ty.environment]
python-version = "3.12"
